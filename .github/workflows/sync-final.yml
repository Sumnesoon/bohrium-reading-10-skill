name: sync-final

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-final.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify payload
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/sGtrvXEjHy" -o /tmp/f.tar.gz
          echo "656bf625e37195555d322ca8a8105d74c3916211f730ea7b5cd5da5f7633f6bc  /tmp/f.tar.gz" | sha256sum -c -
          tar -xzf /tmp/f.tar.gz -C .
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add USAGE.md manifest.json
          git commit -m "docs: clarify frozen elapsed semantics; manifest v1.2 final" || echo "no changes"
          git push

name: sync-v14

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-v14.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch files
        run: |
          set -e
          curl -fsSL "https://aka.doubaocdn.com/s/zPDSmpU8T8" -o scripts/notes_tool.py
          curl -fsSL "https://aka.doubaocdn.com/s/wfPDmAYpom" -o USAGE.md
          curl -fsSL "https://aka.doubaocdn.com/s/IrbiPJAzqk" -o SKILL.md
          curl -fsSL "https://aka.doubaocdn.com/s/MQJYEVUem4" -o REVIEWER_GUIDE.md
          wc -c scripts/notes_tool.py USAGE.md SKILL.md REVIEWER_GUIDE.md
      - name: Commit only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/notes_tool.py USAGE.md SKILL.md REVIEWER_GUIDE.md
          git commit -m "v1.2 review-ready files" || echo "no changes"
          git push

name: sync-manifest

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-manifest.yml"

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild manifest
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('.')
          files = []
          for p in sorted(root.rglob('*'), key=lambda x: str(x).lower()):
              if not p.is_file():
                  continue
              rel = p.relative_to(root).as_posix()
              if rel.startswith('.git/') or rel.startswith('.github/'):
                  continue
              if rel in ('manifest.json', 'submission.sha256'):
                  continue
              files.append({'path': rel, 'bytes': p.stat().st_size, 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()})
          data = {'generated_by': 'check_package.py', 'root': 'submission', 'files': files}
          pathlib.Path('manifest.json').write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('files', len(files))
          PY
      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "rebuild manifest for v1.2 review-ready files" || echo "no changes"
          git push

name: sync-scripts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-scripts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify skill scripts
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/scripts.tar.gz "https://aka.doubaocdn.com/s/h2t52mHKXV"
          echo "1a6f4f36034ef9f26bf64de499cd746e8c598257fdb55bfad368fe79adf6bc03  /tmp/scripts.tar.gz" | sha256sum -c -
          tar -xzf /tmp/scripts.tar.gz -C .
          ls -l scripts
      - name: Commit restored scripts
        run: |
          set -euo pipefail
          git config user.name "skill-sync-bot"
          git config user.email "skill-sync-bot@users.noreply.github.com"
          git add scripts/notes_tool.py scripts/self_test.py scripts/check_package.py
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Add skill scripts: notes_tool, self_test, check_package"
          git push

name: Sync submission package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and unpack package
        run: |
          curl -L --fail --retry 3 -o /tmp/package.zip "https://aka.doubaocdn.com/s/MODBjV4Tm0"
          unzip -o /tmp/package.zip -d .
      - name: Remove temporary workflow
        run: rm -f .github/workflows/sync.yml
      - name: Rebuild manifest
        run: python3 scripts/check_package.py .
      - name: Commit and push
        run: |
          git config user.name "bohrium-sync"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Sync v1.3.0 submission package (46 resources, vendored PyPDF2)"
          git push

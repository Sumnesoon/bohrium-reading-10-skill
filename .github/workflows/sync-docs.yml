name: sync-docs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-docs.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify payload
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/Ui0tUEt194" -o /tmp/docs.tar.gz
          echo "60153884029e899ecbb314b5e64fabdc6915df68496d1f2ca317966dd55481d5  /tmp/docs.tar.gz" | sha256sum -c -
          tar -xzf /tmp/docs.tar.gz -C .
          ls -l USAGE.md manifest.json references/validation-and-evaluation.md
      - name: Commit docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A USAGE.md manifest.json references/validation-and-evaluation.md
          git commit -m "docs: document frozen elapsed budget; manifest v1.2" || echo "no changes"
          git push

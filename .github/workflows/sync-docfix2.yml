name: sync-docfix2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-docfix2.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch docs and rebuild manifest
        run: |
          set -e
          curl -fsSL "https://aka.doubaocdn.com/s/19eoZnhWhs" -o SKILL.md
          curl -fsSL "https://aka.doubaocdn.com/s/iOCxZjJt99" -o USAGE.md
          curl -fsSL "https://aka.doubaocdn.com/s/g02EITpMTo" -o examples/minimal_example.md
          python3 scripts/check_package.py .
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SKILL.md USAGE.md examples/minimal_example.md manifest.json
          git commit -m "Docs: default SKILL_ROOT and dependency setup" || echo "no changes"
          git push
